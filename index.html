<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mua mẫu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--nen:var(--tg-theme-secondary-bg-color,#f2f1ee);--the:var(--tg-theme-bg-color,#fff);--chu:var(--tg-theme-text-color,#1c1b19);
--phu:var(--tg-theme-hint-color,#7a776f);--nhan:var(--tg-theme-button-color,#0f766e);--chu-nut:var(--tg-theme-button-text-color,#fff);
--vien:rgba(127,127,127,.22);--vang:#b45309;--vang-nhat:rgba(245,158,11,.14);--do:#dc2626;--xanh:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
.dau-trang{position:sticky;top:0;z-index:5;background:var(--nen);padding:12px 14px 8px}
h1{font-size:19px;margin:0}.phu{color:var(--phu);font-size:12.5px}
.tim{display:flex;gap:8px;margin-top:8px}.tim input,.tim select{flex:1;min-width:0;border:1px solid var(--vien);background:var(--the);color:var(--chu);
border-radius:10px;padding:8px 10px;font-size:14px}.tim select{flex:0 0 auto}
.loc{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.loc::-webkit-scrollbar{display:none}
.loc button{flex:none;border:1px solid var(--vien);background:var(--the);color:var(--chu);border-radius:999px;padding:5px 12px;font-size:13px}
.loc button.on{background:var(--nhan);border-color:var(--nhan);color:var(--chu-nut)}
h2{font-size:15px;margin:16px 14px 8px;color:var(--phu);font-weight:600}
.ds{padding:0 10px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.the{background:var(--the);border-radius:14px;padding:10px;border:2px solid transparent;transition:border-color .15s}
.the.m{border-color:var(--nhan)}.the.x{border-color:var(--vang)}.the.b{opacity:.5}.the.xong{opacity:.55}
.dong{display:flex;gap:10px}.dong img{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none;background:var(--vien)}
.ten{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gia{font-weight:700;color:var(--nhan)}.chip{display:inline-block;font-size:11px;border-radius:999px;padding:1px 7px;margin:3px 4px 0 0;
background:var(--vien)}.chip.os{background:var(--vang-nhat);color:var(--vang);font-weight:600}
.so{font-size:12px;color:var(--phu);margin-top:3px}.ly{font-size:12.5px;margin:6px 0 0;padding-left:18px;display:none}.the.mo .ly{display:block}
.canh{font-size:12px;color:var(--vang);background:var(--vang-nhat);border-radius:8px;padding:4px 8px;margin-top:6px}
.nut{display:flex;gap:6px;margin-top:8px}.nut button{flex:1;border:1px solid var(--vien);background:transparent;color:var(--chu);
border-radius:9px;padding:8px 4px;font-size:13px}.nut button.on{background:var(--nhan);border-color:var(--nhan);color:var(--chu-nut);font-weight:700}
.nut button.on.do{background:var(--do);border-color:var(--do)}.nut button.on.vang{background:var(--vang);border-color:var(--vang)}
.nut .nho{flex:0 0 auto;padding:8px 10px}.trang{font-size:12px;font-weight:700;color:var(--vang);margin-top:6px}
.rong{text-align:center;color:var(--phu);padding:30px}.loi{margin:30px 16px;padding:14px;border-radius:12px;background:var(--vang-nhat);color:var(--vang)}
.du-phong{position:fixed;left:0;right:0;bottom:0;background:var(--the);border-top:1px solid var(--vien);padding:10px;display:none;text-align:center}
.du-phong a{display:inline-block;background:var(--nhan);color:var(--chu-nut);text-decoration:none;font-weight:700;border-radius:10px;padding:10px 16px;margin:3px}
</style>
</head>
<body>
<div class="dau-trang">
  <h1 id="tieu-de">🛒 Mua mẫu</h1><div class="phu" id="mo-ta">Đang mở…</div>
  <div class="tim"><input id="tim" placeholder="🔍 Tìm tên sản phẩm, shop…"><select id="sap">
    <option value="diem">Điểm cao</option><option value="dt">Doanh thu</option><option value="gia-tang">Giá thấp</option>
    <option value="gia-giam">Giá cao</option><option value="koc">Ít KOC</option></select></div>
  <div class="loc" id="loc-kieu"></div><div class="loc" id="loc-nganh"></div>
</div>
<div id="noi-dung"></div>
<div class="du-phong" id="du-phong"></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
let D = null, chon = {}, kieu = '*', nganh = '*', mo = {};
const KHOA_LUU = () => 'muamau-' + (q.get('f') || '');
const ICON = {m: '🛒 Đã mua', x: '🎁 Xin mẫu', b: '❌ Bỏ', v: '📦 Đã về', t: '🚫 Từ chối'};
const tien = v => !v ? '?' : v >= 1e9 ? (v / 1e9).toFixed(1).replace('.', ',') + ' tỉ' : v >= 1e6 ? Math.round(v / 1e6) + 'tr' : Math.round(v / 1e3) + 'k';
const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function mo_khoa() {
  const k = q.get('k'), f = q.get('f');
  if (!k || !f) throw new Error('Link thiếu khoá — mở trang bằng nút 🛒 Mua mẫu trong chat với bot.');
  const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const r = await fetch('d/' + f + '.bin', {cache: 'no-store'});
  if (!r.ok) throw new Error('Danh sách này đã cũ hoặc chưa tải xong (' + r.status + '). Mở lại nút mới nhất trong chat bot.');
  const b = new Uint8Array(await r.arrayBuffer());
  const txt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
  return JSON.parse(new TextDecoder().decode(txt));
}

function luu() { try { localStorage.setItem(KHOA_LUU(), JSON.stringify(chon)); } catch (er) {} cap_nhat_nut(); }
function bam(c, l) { chon[c] === l ? delete chon[c] : chon[c] = l; luu(); ve(); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }

function the(u, i, loai) {
  const l = chon[u.c] || '', tags = (u.tags || []).map(t => ({top: '🎯 Top', cc: '✂️ Chuyển cảnh', os: '🎥 Oneshot', moi: '🌱 Mới ít KOC', sh: '🚀 Sắp hot'}[t])).filter(Boolean);
  let nut = '';
  if (loai === 'goi' && !u.trang_thai) nut = `<div class="nut"><button class="${l === 'm' ? 'on' : ''}" onclick="bam('${u.c}','m')">🛒 Mua</button>`
    + `<button class="${l === 'x' ? 'on vang' : ''}" onclick="bam('${u.c}','x')">🎁 Xin mẫu</button>`
    + `<button class="${l === 'b' ? 'on do' : ''}" onclick="bam('${u.c}','b')">❌ Bỏ</button></div>`;
  if (loai === 'xin') nut = `<div class="nut"><button class="${l === 'v' ? 'on' : ''}" onclick="bam('${u.c}','v')">📦 Mẫu đã về / duyệt</button>`
    + `<button class="${l === 't' ? 'on do' : ''}" onclick="bam('${u.c}','t')">🚫 Shop từ chối</button></div>`;
  const so = u.so ? `DT 30 ngày ${tien(u.so.dt30)} · ${u.so.koc} KOC · ${u.so.viral} video ≥500k` : (u.ngay ? 'xin từ ' + e(u.ngay) : '');
  return `<div class="the ${l} ${u.trang_thai ? 'xong' : ''} ${mo[u.c] ? 'mo' : ''}">
    <div class="dong"><img src="${u.anh || ''}" alt="" onclick="mo['${u.c}']=!mo['${u.c}'];ve()">
    <div style="min-width:0"><div class="ten">${i ? i + '. ' : ''}${e(u.ten)}</div>
    <div class="phu">${e(u.shop || '')}${u.nganh ? ' · ' + e(u.nganh) : ''}</div>
    ${u.gia ? `<span class="gia">${e(u.gia)}</span>` : ''}${u.diem != null ? `<span class="chip">${u.diem} điểm</span>` : ''}
    ${tags.map(t => `<span class="chip ${t.includes('Oneshot') ? 'os' : ''}">${t}</span>`).join('')}
    <div class="so">${so}</div></div></div>
    ${u.ly_do && u.ly_do.length ? `<ul class="ly">${u.ly_do.map(x => `<li>${e(x)}</li>`).join('')}</ul>` : ''}
    ${u.tuong_tu ? `<div class="canh">⚠ Mẫu tương tự đã có: ${e(u.tuong_tu)}</div>` : ''}
    ${u.co_mau ? `<div class="canh">♻️ Đã có mẫu (${e(u.co_mau)}) — quay lại với hook / góc mới, không mua lại</div>` : ''}
    ${u.trang_thai ? `<div class="trang">${e(u.trang_thai)}</div>` : ''}
    <div class="nut">${u.link ? `<button class="nho" onclick="mo_link('${e(u.link)}')">🔗 Mở sản phẩm</button>` : ''}
    ${u.ly_do && u.ly_do.length ? `<button class="nho" onclick="mo['${u.c}']=!mo['${u.c}'];ve()">${mo[u.c] ? '▲ Ẩn' : '▼ Lý do'}</button>` : ''}</div>
    ${nut}</div>`;
}

function mo_link(u) { tg ? tg.openLink(u) : window.open(u, '_blank'); }

function loc_sap(ds) {
  const t = $('#tim').value.trim().toLowerCase(), s = $('#sap').value;
  let r = ds.filter(u => (kieu === '*' || (u.tags || []).includes(kieu) || (kieu === 'chua' && !chon[u.c]))
    && (nganh === '*' || u.nganh === nganh) && (!t || (u.ten + ' ' + (u.shop || '')).toLowerCase().includes(t)));
  const f = {diem: u => -(u.diem || 0), dt: u => -((u.so || {}).dt30 || 0), 'gia-tang': u => u.gia_so || 9e12,
             'gia-giam': u => -(u.gia_so || 0), koc: u => ((u.so || {}).koc ?? 9e9)}[s];
  return r.sort((a, b) => f(a) - f(b));
}

function ve() {
  const goi = loc_sap(D.goi_y);
  let h = `<h2>🎯 Gợi ý (${goi.length}/${D.goi_y.length})</h2><div class="ds">`
    + (goi.map(u => the(u, D.goi_y.indexOf(u) + 1, 'goi')).join('') || '<div class="rong">Không có sản phẩm khớp bộ lọc</div>') + '</div>';
  if (D.dang_xin.length) h += `<h2>🎁 Đang xin mẫu (${D.dang_xin.length}) — tích khi có kết quả</h2><div class="ds">`
    + D.dang_xin.map(u => the(u, 0, 'xin')).join('') + '</div>';
  if (D.cho.length) h += `<h2>⏳ Chờ phân tích (${D.cho.length})</h2><div class="ds"><div class="the">`
    + D.cho.map(x => `<div>• ${e(x.ten)} <span class="phu">— ${e(x.nguon)}</span></div>`).join('')
    + `<div class="nut"><button class="${chon.__chay ? 'on' : ''}" onclick="chon.__chay=!chon.__chay;if(!chon.__chay)delete chon.__chay;luu();ve()">▶ Chạy phân tích khi gửi</button></div></div></div>`;
  if (D.da_co.length) h += `<h2>♻️ Mẫu đã có — vẫn hot (${D.da_co.length})</h2><div class="ds">` + D.da_co.map(u => the(u, 0, 'co')).join('') + '</div>';
  $('#noi-dung').innerHTML = h;
  document.querySelectorAll('#loc-kieu button').forEach(b => b.classList.toggle('on', b.dataset.k === kieu));
  document.querySelectorAll('#loc-nganh button').forEach(b => b.classList.toggle('on', b.dataset.k === nganh));
}

function so_chon() { return Object.keys(chon).filter(k => k !== '__chay').length; }
function goi_du_lieu() {
  const nhom = {}; Object.entries(chon).forEach(([c, l]) => { if (c !== '__chay') (nhom[l] = nhom[l] || []).push(c); });
  return {v: 1, f: q.get('f'), chon: nhom, chay: !!chon.__chay};
}
function gui() {
  const d = JSON.stringify(goi_du_lieu());
  try { localStorage.removeItem(KHOA_LUU()); } catch (er) {}
  tg.sendData(d);  // bot nhận tin web_app_data (từ đúng tài khoản Telegram của người bấm) rồi Mini App tự đóng
}
function cap_nhat_nut() {
  const n = so_chon(), c = !!chon.__chay;
  if (tg && tg.initData !== undefined && tg.MainButton) {
    if (n || c) { tg.MainButton.setText(n ? `📨 Gửi ${n} lựa chọn${c ? ' + chạy' : ''}` : '▶ Gửi lệnh chạy phân tích'); tg.MainButton.show(); }
    else tg.MainButton.hide();
  }
  if (!tg || !tg.initData) {  // mở ngoài Telegram: dự phòng bằng link t.me (≤ 64 ký tự/link)
    const dp = $('#du-phong'), nhom = goi_du_lieu().chon, phan = []; let cur = '';
    Object.entries(nhom).forEach(([l, cs]) => cs.forEach((c, j) => {
      const them = (j ? '-' : (cur ? '_' : '') + l) + c;
      if ((cur + them).length > 64) { phan.push(cur); cur = l + c; } else cur += them; }));
    if (cur) phan.push(cur);
    dp.style.display = n ? 'block' : 'none';
    dp.innerHTML = phan.map((p, i) => `<a href="https://t.me/${D.bot}?start=${p}">📨 Gửi qua Telegram${phan.length > 1 ? ` (${i + 1}/${phan.length})` : ''}</a>`).join('');
  }
}

(async () => {
  try {
    D = await mo_khoa();
    try { chon = JSON.parse(localStorage.getItem(KHOA_LUU()) || '{}'); } catch (er) {}
    $('#tieu-de').textContent = '🛒 Mua mẫu ' + D.ngay;
    $('#mo-ta').textContent = `${D.goi_y.length} gợi ý · bấm 🛒 / 🎁 / ❌ rồi bấm nút Gửi ở dưới · chạm ảnh để xem lý do`;
    const ks = [['*', 'Tất cả'], ['top', '🎯 Top'], ['cc', '✂️ Chuyển cảnh'], ['os', '🎥 Oneshot'], ['moi', '🌱 Mới ít KOC'], ['sh', '🚀 Sắp hot'], ['chua', '⬜ Chưa chọn']];
    $('#loc-kieu').innerHTML = ks.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join('');
    const ng = [...new Set(D.goi_y.map(u => u.nganh).filter(Boolean))];
    $('#loc-nganh').innerHTML = ng.length > 1 ? [['*', 'Mọi ngành'], ...ng.map(n => [n, n])].map(([k, t]) => `<button data-k="${e(k)}">${e(t)}</button>`).join('') : '';
    document.querySelectorAll('#loc-kieu button').forEach(b => b.onclick = () => { kieu = b.dataset.k; ve(); });
    document.querySelectorAll('#loc-nganh button').forEach(b => b.onclick = () => { nganh = b.dataset.k; ve(); });
    $('#tim').oninput = ve; $('#sap').onchange = ve;
    if (tg) { tg.MainButton.onClick(gui); }
    ve(); cap_nhat_nut();
  } catch (er) {
    $('#mo-ta').textContent = ''; $('#noi-dung').innerHTML = `<div class="loi">⚠ ${e(er.message)}</div>`;
  }
})();
</script>
</body>
</html>
